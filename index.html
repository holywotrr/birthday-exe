<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Birthday.exe</title>

<link rel="stylesheet"
href="https://unpkg.com/98.css">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<!-- BOOT SCREEN -->

<section id="boot">

<div class="boot-content">

<h1>Microsoft Windows XP</h1>

<div class="loader">

<div class="bar"></div>

</div>

<p>Starting Windows...</p>

</div>

</section>

<!-- LOGIN -->

<section id="login" hidden>

<div class="window login-window">

<div class="title-bar">

<div class="title-bar-text">

Windows XP Professional

</div>

</div>

<div class="window-body">

<p>

Please log on to Windows.

</p>

<label>

Username

<input
id="username"
type="text"
placeholder="Use your real name">

</label>

<br><br>

<label>

Password

<input
id="password"
type="password"
placeholder="Type anything">

</label>

<br><br>

<button id="loginBtn">

OK

</button>

</div>

</div>

</section>

<script src="js/main.js"></script>

</body>

</html>
