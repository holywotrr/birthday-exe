<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<link rel="stylesheet"

<body>

<body>

<!-- BOOT -->

<section id="boot">

    <div class="boot-content">

        <h1>Microsoft Windows XP</h1>

        <div class="loader">

            <div class="bar"></div>

        </div>

        <p>Starting Windows...</p>

    </div>

</section>

<!-- LOGIN -->

<section id="login" hidden>

<div class="window login-window">

<div class="title-bar">

<div class="title-bar-text">

Windows XP Professional

</div>

</div>

<div class="window-body">

<p>Please log on to Windows.</p>

<label>

Username

<input
id="username"
type="text">

</label>

<br><br>

<label>

Password

<input
id="password"
type="password">

</label>

<br><br>

<button id="loginBtn">

OK

</button>

</div>

</div>

</section>

<!-- DESKTOP -->

<section id="desktop" hidden>

<img
class="wallpaper"
src="assets/wallpapers/bliss.jpg">

<div id="desktop-icons">

<div class="desktop-icon"
id="birthday">

<img src="assets/icons/birthday.png">

<p>Birthday.exe</p>

</div>

<div class="desktop-icon">

<img src="assets/icons/readme.png">

<p>Readme.txt</p>

</div>

<div class="desktop-icon">

<img src="assets/icons/computer.png">

<p>My Computer</p>

</div>

</div>

<div id="taskbar">

<button id="start">

Start

</button>

<div id="clock">

12:00 PM

</div>

</div>

</section>

<script src="js/main.js"></script>
